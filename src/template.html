<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>
</head>
<body>
    <button id="sidebar-toggling-btn"><img src="./assets/menu.svg" alt="" height="23" width="23"></button>
    <div id="sidebar">
        <div class="user hover">
            <img src="./assets/account-circle-outline.svg" alt="" height="33" width="33">
            <div>Anonymous</div>
        </div>

           <div id="project-container">
                <div id="project-container-header" class="hover">
                    <div class="title">Projects</div>

                    <!--opens the dialog that contains the project adding form-->
                    <button id="sidebar-add-project-btn" class="low">+</button> 
                </div>

                <ul id="projects-list">
                    <!--Projects will be added here via JavaScript-->
                </ul>
            </div>
    </div>

    <div id="project-page">
        <div class="wrapper">
            <div class="form-element title-container">    
                <span class="char-counter"></span>
                <span class="note"></span>
            </div>

            <div class="form-element description-container">
                <span class="char-counter"></span>
                <span class="note"></span>
            </div>

            <button id="task-add-btn">+</button>

            <div id="cards-container">
                <!-- tasks here -->
            </div>
        </div>
    </div>
    
    <dialog id="project-dialog">
        <form action="" method="dialog">
            <div class="form-element title-contaienr">
                <input type="text" name="project-title" id="project-title" placeholder="Title" minlength="2" maxlength="50" pattern="^\S{1,}.*" required>
                <span class="char-counter"></span>
            </div>

            <div class="form-element description-container">
                <input type="text" name="project-description" id="project-description" placeholder="Description" autocorrect="on" maxlength="80"></input>
                <span class="char-counter"></span>
            </div>
            
            <div>
                <button type="button" class="project-dialog-close-btn" command="close" commandfor="project-dialog">Close</button>
                <button id="project-form-submit-btn" type="submit" disabled>Add</button> <!--Disabled by default, gets enabled via js-->
            </div>
        </form>
    </dialog>

    <dialog id="tasks-dialog">
        <form action="" method="dialog">
            <div class="form-element">
                <label for="task-title">Task Title</label>
                <input type="text" name="task-title" id="task-title" placeholder="Title" minlength="2" maxlength="50" pattern="^\S{1,}.*" required>
                <span class="char-counter"></span>
            </div>

            <div class="form-element">
                <label for="task-description">Task Description</label`>
                <input type="text" name="task-description" id="task-description" placeholder="Description" maxlength="80">
                <span class="char-counter"></span>
            </div>

            <div>
                <label for="task-due-date">Due Date</label>
                <input type="date" name="task-due-date" id="task-due-date">
            </div>
            
            <div>
                <label for="task-priority">Task Priority</label>
                <select name="task-priority" id="task-priority">
                    <option disabled hidden selected value="">Priority</option>
                    <option value="4">Urgent</option>
                    <option value="3" selected>Important</option>
                    <option value="2">Less Important</option>
                    <option value="1">Not Important</option>
                </select>
            </div>

            <div>
                <label for="task-project">Select Project</label>
                <select name="task-project" id="task-project" required>
                    
                </select>

            </div>
            
            <div>
                <button type="button" class="task-close-btn" command="close" commandfor="tasks-dialog">Close</button>
                <button id="task-dialog-submit-btn" type="submit" disabled>Add</button> <!--Disabled by default, gets enabled via js-->
            </div>
        </form>
    </dialog>
</body>
</html>
