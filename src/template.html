<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>
</head>
<body>
    <div id="sidebar">
        <div class="user hover">
            <img src="./assets/account-circle-outline.svg" alt="" height="33" width="33">
            <div>Abdulwhab Mohammed</div>
        </div>

           <div id="project-container">
                <div id="project-container-header" class="hover">
                    <div class="title">Projects</div>

                    <!--opens the dialog that contains the project adding form-->
                    <button id="add-project-btn" command="show-modal" commandfor="add-project-dialog">+</button> 
                </div>

                <!-- Indicates the current amount of project that a user has comparing to the max amount-->
                <span id="project-counter">0 / 15</span>

                <ul id="project-list">
                    <!--Projects will be added here via JavaScript-->
                </ul>
            </div>
    </div>

    <div id="main-content"></div>
    
    <dialog id="add-project-dialog">
        <form action="" method="dialog">
            <input type="text" name="project-title" id="project-title" placeholder="Title" minlength="2" maxlength="30" required>
            <textarea name="project-description" id="project-description" rows="4" columns="30" placeholder="Description" autocorrect="on" maxlength="80"></textarea>
            
            <div>
                <button type="button" class="close-dialog-btn" command="close" commandfor="add-project-dialog">Close</button>
                <button id="add-project-form-btn">Add</button>
            </div>
        </form>
    </dialog>

</body>
</html>
