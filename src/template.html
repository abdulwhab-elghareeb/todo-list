<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>
</head>
<body>
    <div id="sidebar">
        <button id="sidebar-toggling-btn"><img src="./assets/menu.svg" alt="" height="23" width="23"></button>
        <div class="user hover">
            <img src="./assets/account-circle-outline.svg" alt="" height="33" width="33">
            <div>Abdulwhab Mohammed</div>
        </div>

           <div id="project-container">
                <div id="project-container-header" class="hover">
                    <div class="title">Projects</div>

                    <!--opens the dialog that contains the project adding form-->
                    <button id="project-dialog-show-btn">+</button> 
                </div>

                <!-- Indicates the current amount of project that a user has comparing to the max amount-->
                <span id="projects-counter" class="low">0 / 15</span>

                <ul id="project-list">
                    <!--Projects will be added here via JavaScript-->
                </ul>
            </div>
    </div>

    <div id="main">
        <div class="wrapper">
            <div class="form-element title-container">    
                <span class="char-counter"></span>
                <span class="note"></span>
            </div>

            <div class="form-element description-container">
                <span class="char-counter"></span>
                <span class="note"></span>
            </div>

            <button class="task-add-btn" command="show-modal" commandfor="tasks-dialog">+</button>
        </div>
    </div>
    
    <dialog id="project-dialog">
        <form action="" method="dialog">
            <div class="form-element title-contaienr">
                <input type="text" name="project-title" id="project-title" placeholder="Title" minlength="2" maxlength="30" pattern="^\S{2,}.*" required>
                <span class="char-counter">0 / 30</span>
            </div>

            <div class="form-element description-container">
                <textarea name="project-description" id="project-description" rows="4" columns="30" placeholder="Description" autocorrect="on" maxlength="80"></textarea>
                <span class="char-counter">0 / 80</span>
            </div>
            
            <div>
                <button type="button" class="project-dialog-close-btn" command="close" commandfor="project-dialog">Close</button>
                <button id="project-form-submit-btn" type="submit" disabled>Add</button> <!--Disabled by default, gets enabled via js-->
            </div>
        </form>
    </dialog>

    <dialog id="tasks-dialog">
        <form action="" method="dialog">
            <div>
                <label for="task-title">Task Title</label>
                <input type="text" name="task-title" id="task-title" placeholder="Title" minlength="2" maxlength="30" pattern="^\S{2,}.*" required>
                <span class="char-counter">0 / 30</span>
            </div>

            <div>
                <label for="task-description">Task Description</label`>
                <input type="text" name="task-description" id="task-description" placeholder="Description" maxlength="80">
                <span class="char-counter">0 / 80</span>
            </div>

            <div>
                <label for="task-date">Due Date</label>
                <input type="date" name="task-date" id="task-date">
            </div>
            
            <div>
                <label for="task-priority">Task Priority</label>
                <select name="task-priority" id="task-priority">
                    <option disabled hidden selected value="">Priority</option>
                    <option>Urgent</option>
                    <option>Important</option>
                    <option>Less Important</option>
                    <option>Not Important</option>
                </select>
            </div>
            
            <div>
                <button type="button" class="task-close-btn" command="close" commandfor="tasks-dialog">Close</button>
                <button id="task-submit-btn" type="submit" disabled>Add</button> <!--Disabled by default, gets enabled via js-->
            </div>
        </form>
    </dialog>
</html>
